name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest and skill files
        run: node scripts/validate-manifest.mjs
